<style>

*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--fg);

label{display:flex;gap:8px;align-items:center;margin:12px 0;font-size:13px;color:var(--muted)}
button{width:100%;font:inherit;font-weight:600;padding:10px;border:0;border-radius:8px;background:var(--fg);
color:var(--bg);cursor:pointer} button:disabled{opacity:.6}
#err{color:var(--neg);min-height:1.2em;margin:10px 0 0;font-size:13px}

const tob64=a=>btoa(String.fromCharCode(...a));
function saved(){try{return localStorage.getItem(STORE)}catch(e){return null}}
function remember(k){try{localStorage.setItem(STORE,k)}catch(e){}}
function forget(){try{localStorage.removeItem(STORE)}catch(e){}}
async function derive(pw){
 const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
 return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:new TextEncoder().encode(SALT),

}
async function open_(raw){

 return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(NONCE)},key,b64(DATA)));
}
function show(html){document.open();document.write(html);document.close()}
const f=document.getElementById("f"),err=document.getElementById("err"),go=document.getElementById("go");
